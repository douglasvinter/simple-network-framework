[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simple-network-framework"
version = "1.0.0"
description = "An extensible asyncio framework for local network service discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Douglas Vinter" }]
dependencies = []

[project.optional-dependencies]
ssdp = ["async-upnp-client>=0.49.0"]
mdns = ["zeroconf>=0.154.0"]
all = ["async-upnp-client>=0.49.0", "zeroconf>=0.154.0"]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "mypy>=1.18"]

[project.entry-points."snf.protocols"]
ssdp = "snf.adapters.ssdp:SSDPPlugin"
mdns = "snf.adapters.mdns:MDNSPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/snf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
