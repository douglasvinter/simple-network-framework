[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simple-network-framework"
version = "0.2.0a1"
description = "An extensible asyncio framework for local device and service discovery."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Douglas Vinter" }]
dependencies = []

[project.optional-dependencies]
ssdp = ["async-upnp-client>=0.49.0", "aiohttp>=3.9,<4"]
mdns = ["zeroconf>=0.154.0"]
ble = ["bleak>=0.22.3"]
api = ["fastapi>=0.115,<1", "sse-starlette>=2.2,<4", "uvicorn>=0.30,<1"]
all = [
    "async-upnp-client>=0.49.0",
    "aiohttp>=3.9,<4",
    "zeroconf>=0.154.0",
    "bleak>=0.22.3",
    "fastapi>=0.115,<1",
    "sse-starlette>=2.2,<4",
    "uvicorn>=0.30,<1",
]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "mypy>=1.18", "httpx>=0.27"]

[project.entry-points."snf.protocols"]
ssdp = "snf.adapters.ssdp:SSDPPlugin"
mdns = "snf.adapters.mdns:MDNSPlugin"
slp = "snf.adapters.slp:SLPPlugin"
ble = "snf.adapters.ble:BLEPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/snf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
